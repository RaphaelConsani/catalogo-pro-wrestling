# Sincronização entre aparelhos (Mac e iPhone) do Catálogo de Pro Wrestling.
# Publicar: cd sync && npx wrangler@4.156.0 deploy
# Banco: npx wrangler@4.156.0 d1 migrations apply catalogo-sync --remote
name = "catalogo-sync"
main = "src/index.js"
compatibility_date = "2026-10-15"

[[d1_databases]]
binding = "DB"
database_name = "catalogo-sync"
database_id = "333d5bab-f042-40ce-bf29-2497c6374a7e"
migrations_dir = "migrations"
